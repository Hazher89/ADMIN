<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f7fa;
        }
        .logo-container {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border-radius: 12px;
            padding: 20px;
            display: inline-block;
            margin: 20px;
        }
        .logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .mobile-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Logo Test</h1>
    
    <h2>Sidebar Logo (Desktop)</h2>
    <div class="logo-container">
        <img src="/logo.svg" alt="DriftPro" class="logo">
    </div>
    
    <h2>Mobile Logo</h2>
    <img src="/logo.svg" alt="DriftPro" class="mobile-logo">
    
    <h2>Logo URL Test</h2>
    <p>Logo URL: <a href="/logo.svg" target="_blank">/logo.svg</a></p>
    
    <h2>All Logo Files</h2>
    <ul>
        <li><a href="/logo.svg" target="_blank">logo.svg</a></li>
        <li><a href="/logo-white.svg" target="_blank">logo-white.svg</a></li>
        <li><a href="/logo-black.svg" target="_blank">logo-black.svg</a></li>
        <li><a href="/logo-icon.svg" target="_blank">logo-icon.svg</a></li>
    </ul>
</body>
</html>
